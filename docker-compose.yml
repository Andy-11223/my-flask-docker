version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev        # ← points to dev image
    ports:
      - "5000:5000"
    volumes:
      - .:/app                          # ← hot-reload: mounts your code
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: unless-stopped