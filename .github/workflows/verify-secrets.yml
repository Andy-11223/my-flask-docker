name: Verify Secrets

on:
  workflow_dispatch:        # manual trigger only

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check if secrets are set
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ DOCKER_USERNAME is empty or not set"
            exit 1
          else
            echo "✅ DOCKER_USERNAME is set"
          fi

          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ DOCKER_PASSWORD is empty or not set"
            exit 1
          else
            echo "✅ DOCKER_PASSWORD is set"
          fi

      - name: Test Docker Hub login (without pushing)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Confirm login worked
        run: echo "✅ Login succeeded — secrets are valid!"